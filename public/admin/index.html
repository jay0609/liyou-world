<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>璃幽宇宙 · 内容管理</title>
  <style>
    body { margin: 0; background: #1E1833; }
    [data-netlify-identity-menu] { display: none; }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // 本地开发时使用代理后端，生产环境使用 GitHub 后端
    const isLocal = window.location.hostname === 'localhost'
    CMS.init({
      config: {
        backend: {
          name: 'github',
          repo: 'YOUR_GITHUB_USER/YOUR_REPO_NAME',
          branch: 'main',
          base_url: 'https://cs2npc.cn',
          auth_endpoint: '/api/auth',
        },
        load_config_file: false,
      },
    })
  </script>
</body>
</html>
